[functions.aggregate-election-stances]
enabled = true
# Sep 2026 (H-18): MUST stay true. Its in-body guard used to fail OPEN, and with
# verify_jwt=false there was no platform gate behind it. The guard is now fail-closed,
# but this flag is what makes its service_role-JWT path sound at all: that path reads
# claims without verifying the signature, which is only safe because the platform
# validates the credential first. Invoked by admin.cron_aggregate_election_stances()
# every 30 minutes, which sends a service_role bearer plus x-cron-secret.
verify_jwt = true
entrypoint = "./functions/aggregate-election-stances/index.ts"

[functions.detect-election-anomalies]
enabled = true
# Sep 2026 (H-18): MUST stay true - same reasoning as aggregate-election-stances above.
# Invoked by admin.cron_detect_election_anomalies() hourly.
verify_jwt = true
entrypoint = "./functions/detect-election-anomalies/index.ts"

[functions.notify-election-updates]
enabled = true
# Sep 2026 (H-13): MUST stay true. This endpoint writes user_notifications rows for
# arbitrary users, and its in-body guard used to fail OPEN - `if (cronSecret && ...)`
# short-circuits to false whenever CRON_SECRET is unset, admitting everyone. With
# verify_jwt=false there was no platform gate behind that. The guard is now fail-closed
# on all three paths, but this flag is the second layer AND the thing that makes the
# service_role-JWT path safe at all: that path reads claims without verifying the
# signature, which is only sound because the platform validates the credential first.
# Leaving this false here would silently revert the fix on the next CLI deploy.
verify_jwt = true
entrypoint = "./functions/notify-election-updates/index.ts"

# Sep 2026 (Epic I QA pass): the five notification jobs below MUST keep verify_jwt = true.
# Their H-04b in-body check accepts a service_role JWT by reading its claims WITHOUT
# verifying the signature - which is only sound because the platform validates the
# credential first. Setting any of these to false makes those claims forgeable.

[functions.notify-weekly-digest]
enabled = true
verify_jwt = true
entrypoint = "./functions/notify-weekly-digest/index.ts"

[functions.notify-stance-changes]
enabled = true
verify_jwt = true
entrypoint = "./functions/notify-stance-changes/index.ts"

[functions.notify-topic-follows]
enabled = true
verify_jwt = true
entrypoint = "./functions/notify-topic-follows/index.ts"

[functions.notify-reminders]
enabled = true
verify_jwt = true
entrypoint = "./functions/notify-reminders/index.ts"

[functions.notify-new-local-topics]
enabled = true
verify_jwt = true
entrypoint = "./functions/notify-new-local-topics/index.ts"

[functions.ugq-screen]
verify_jwt = false

[functions.ugq-publish]
verify_jwt = false

[functions.ugq-moderate]
# Sep 2026: MUST stay false, and was MISSING from this file entirely while the
# deployed function ran with verify_jwt=false - so the next CLI deploy would have
# silently flipped it to true. It does its own authorization two ways: an admin_users
# lookup for admin actions, and an x-cron-secret check for the narrow system path
# (action=approve only) that ugq-verify-preview uses. That system call sends NO
# Authorization header at all, so a platform-level JWT gate would reject it outright.
verify_jwt = false

[functions.ugq-video-url]
# Sep 2026: MUST stay false, and was likewise MISSING from this file. Public and
# unauthenticated by design - anonymous visitors play raw clips on published video
# questions. It takes only question_id (never a storage path), resolves the path
# server-side, and since defect UGQ-D4 also requires questions.status = active.
verify_jwt = false

[functions.whatsapp-flow-webhook]
enabled = true
verify_jwt = false
entrypoint = "./functions/whatsapp-flow-webhook/index.ts"

[functions.whatsapp-send-flow]
enabled = true
verify_jwt = false
entrypoint = "./functions/whatsapp-send-flow/index.ts"

[functions.whatsapp-broadcast-dispatch]
enabled = true
# Sep 2026 (W-01): MUST stay true. This endpoint sends WhatsApp messages and had no
# authorization check of its own, so verify_jwt=false left it publicly invokable by anyone.
# pg_cron sends a service_role JWT and the function now verifies the service_role claim.
verify_jwt = true
entrypoint = "./functions/whatsapp-broadcast-dispatch/index.ts"

[functions.enrich-images]
enabled = true
verify_jwt = false
entrypoint = "./functions/enrich-images/index.ts"
[functions.whatsapp-flow-endpoint]
enabled = true
# Sep 2026 (F2 build): MUST stay false, and was MISSING from this file entirely while
# the deployed function ran with verify_jwt=false - the next CLI deploy would have
# silently flipped it to true and broken the Flow. Meta calls this endpoint directly
# and never sends a Supabase JWT; it authenticates the caller itself, two ways:
# RSA-OAEP decryption of the payload with our private key (an attacker cannot produce
# a decryptable body), and optional x-hub-signature-256 HMAC verification when
# WHATSAPP_APP_SECRET is set. Same defect shape as ugq-moderate and ugq-video-url.
verify_jwt = false
entrypoint = "./functions/whatsapp-flow-endpoint/index.ts"
